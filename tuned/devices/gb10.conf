# tuned/devices/gb10.conf — static device config for GB10 (DGX Spark,
# Grace Blackwell, aarch64).
#
# GPU_TUNED_FA_ARCH here is an arch code in this repo's own scheme
# (Dao-AILab's setup.py: FLASH_ATTN_CUDA_ARCHS, semicolon-separated,
# NOT the vllm fork's dotted "12.1a"-style string) -- do not copy the
# vllm-fork sibling's "12.1a" value verbatim, the two repos' env vars take
# different formats (this one has no dot).
#
# "121a" (not "121"): true architecture-specific sm_121 SASS, not the
# family-generic "121f" that upstream PR #2257 defaults to -- see
# setup.py's add_cuda_gencodes() comment on the "121a" branch (a
# zbrad/flash-attention-only addition on top of the cherry-picked PR) and
# ../SM121_SUPPORT.md. Matches zbrad/pytorch's own GB10 wheels and
# zbrad/flash-attention-vllm's tuned CMakeLists, both already sm_121a.
GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"
GPU_TUNED_FA_ARCH="121a"
GPU_TUNED_HW_LABEL="GB10 / DGX Spark (Grace Blackwell, SM 121a)"
