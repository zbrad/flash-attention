# tuned/devices/gb10.conf — static device config for GB10 (DGX Spark,
# Grace Blackwell, aarch64).
#
# GPU_TUNED_FA_ARCH here is a plain integer arch code in this repo's own
# scheme (Dao-AILab's setup.py: FLASH_ATTN_CUDA_ARCHS, semicolon-separated
# "80;90;100;110;120;121", NOT the vllm fork's "12.1a"-style family-suffix
# string) -- do not copy the vllm-fork sibling's "12.1a" value here, the
# two repos' env vars take different formats. See
# ../SM121_SUPPORT.md for how "121" maps to an actual -gencode flag.
GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"
GPU_TUNED_FA_ARCH="121"
GPU_TUNED_HW_LABEL="GB10 / DGX Spark (Grace Blackwell, SM 121)"
