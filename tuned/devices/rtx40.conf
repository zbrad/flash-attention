# tuned/devices/rtx40.conf — static device config for RTX 40 (Ada
# Lovelace, x86_64).
#
# NOT natively targeted by this repo's add_cuda_gencodes(): the recognized
# arch codes are only 80/90/100/110/120/121 (no 89 bucket at all, unlike
# the vllm fork's own CMakeLists which does target 8.9 explicitly). Ada
# kernels here run via the sm_80 SASS path (Ampere-compatible for the ops
# this kernel set uses) or PTX JIT, not a native sm_89 build. Using "80"
# as the arch code is the closest true equivalent available upstream;
# revisit if/when Dao-AILab adds an 89 bucket.

GPU_TUNED_VARIANT="rtx40"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_FA_ARCH="80"
GPU_TUNED_HW_LABEL="RTX 4080/4090 (Ada Lovelace, SM 89, built via sm_80 compat path)"
