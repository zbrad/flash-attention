# tuned/devices/rtx50.conf — static device config for RTX 50 (Blackwell
# consumer, x86_64).
#
# "120" maps to compute_120f/sm_120 in this repo's own add_cuda_gencodes()
# on CUDA >= 12.9 (family-specific SASS, same shape as GB10's 121f) --
# already native in upstream Dao-AILab, no cherry-pick needed for this one.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_FA_ARCH="120"
GPU_TUNED_HW_LABEL="RTX 50-series (Blackwell consumer, desktop/laptop, SM 120)"
